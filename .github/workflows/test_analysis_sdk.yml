name: Test standalone analysis SDK
permissions: read-all
on:
  pull_request:
    paths:
      - 'sdk/**'
      - '.github/workflows/test_analysis_sdk.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build standalone wheel
        run: python -m pip wheel --no-deps ./sdk --wheel-dir /tmp/optscale-wheels
      - name: Install wheel without platform dependencies
        run: python -m pip install --no-deps /tmp/optscale-wheels/*.whl
      - name: Run offline and collector tests
        run: python -m unittest discover -s sdk/tests -v
      - name: Install AWS extra and verify botocore contracts
        run: |
          python -m pip install 'boto3>=1.40.50,<2'
          python -m unittest discover -s sdk/tests -v
      - name: Exercise installed CLI
        run: |
          optscale-scan --mode recommendations --input sdk/examples/snapshot.json --rules volumes_not_attached_for_a_long_time
          optscale-scan --mode resources --input sdk/examples/snapshot.json --resource-types volume
          optscale-scan --mode anomalies --input sdk/examples/anomalies.json --anomaly-types expense resource_count
          optscale-scan --mode expenses --input sdk/examples/expenses.json
